name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

env:
  PUBLIC_REPO: hj01857655/kiro-token-manager
  CARGO_INCREMENTAL: 0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          # 去掉 v 前缀
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Update version in config files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # 更新 tauri.conf.json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauri.package.version = $version
          $tauri | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          # 更新 Sidebar.jsx
          (Get-Content src/components/Sidebar.jsx) -replace "const VERSION = '.*'", "const VERSION = '$version'" | Set-Content src/components/Sidebar.jsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          VERSION_NUM=${VERSION#v}
          echo "version=$VERSION_NUM" >> $GITHUB_OUTPUT

      - name: Update version in config files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 更新 tauri.conf.json
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # 更新 Sidebar.jsx
          sed -i '' "s/const VERSION = '.*'/const VERSION = '$VERSION'/" src/components/Sidebar.jsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build Tauri App (Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync README to public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ env.PUBLIC_REPO }}.git public_repo
          cp README.md public_repo/ 2>/dev/null || true
          cd public_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Sync README from private repo"
          git push || true

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: ./artifacts/windows

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: ./artifacts/windows
        continue-on-error: true

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./artifacts/macos

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: List artifacts
        run: find ./artifacts -type f

      - name: Create Release on Public Repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSION_NUM=${VERSION#v}
          
          # 删除旧的 release 和 tag
          gh release delete "$VERSION" --repo ${{ env.PUBLIC_REPO }} --yes 2>/dev/null || true
          gh api repos/${{ env.PUBLIC_REPO }}/git/refs/tags/$VERSION --method DELETE 2>/dev/null || true
          
          # 收集文件
          mapfile -t FILES < <(find ./artifacts -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \))
          
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Error: No installer files found!"
            exit 1
          fi
          
          echo "Uploading ${#FILES[@]} files:"
          printf '%s\n' "${FILES[@]}"
          
          # 获取文件名
          MSI_FILE=$(basename "$(find ./artifacts -name '*.msi' | head -1)" 2>/dev/null || echo "")
          EXE_FILE=$(basename "$(find ./artifacts -name '*.exe' | head -1)" 2>/dev/null || echo "")
          DMG_FILE=$(basename "$(find ./artifacts -name '*.dmg' | head -1)" 2>/dev/null || echo "")
          
          BASE_URL="https://github.com/${{ env.PUBLIC_REPO }}/releases/download/$VERSION"
          
          cat > release_notes.md << EOF
          ## 下载
          
          | 平台 | 文件 | 说明 |
          |------|------|------|
          | Windows | [$MSI_FILE]($BASE_URL/$MSI_FILE) | 推荐，双击安装 |
          | Windows | [$EXE_FILE]($BASE_URL/$EXE_FILE) | NSIS 安装程序 |
          | macOS | [$DMG_FILE]($BASE_URL/$DMG_FILE) | 拖入 Applications |
          
          ## 系统要求
          - Windows 10/11 (64-bit) + WebView2
          - macOS 10.15+ (Intel/Apple Silicon)
          
          ## 功能
          - 🔐 多账号管理与切换
          - 📊 配额实时监控
          - 🔄 一键重置机器 ID
          - ⚙️ IDE 设置同步
          - 🎨 多主题切换
          EOF
          
          gh release create "$VERSION" \
            --repo ${{ env.PUBLIC_REPO }} \
            --title "Kiro Token Manager $VERSION" \
            --notes-file release_notes.md \
            "${FILES[@]}"
