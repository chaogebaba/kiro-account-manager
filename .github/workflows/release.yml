name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

env:
  PUBLIC_REPO: hj01857655/kiro-token-manager
  CARGO_INCREMENTAL: 0

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri App
        shell: pwsh
        run: |
          cd src-tauri
          cargo build --release --features custom-protocol
          cargo tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: List build outputs
        shell: pwsh
        run: |
          Write-Host "=== MSI files ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Recurse -ErrorAction SilentlyContinue
          Write-Host "=== NSIS files ==="
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -ErrorAction SilentlyContinue

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: ./artifacts/msi

      - name: Download NSIS artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: ./artifacts/nsis
        continue-on-error: true

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: List artifacts
        run: |
          echo "=== All artifacts ==="
          find ./artifacts -type f -name "*.msi" -o -name "*.exe" | head -20

      - name: Create Release on Public Repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          # 检查 release 是否已存在，存在则删除
          gh release delete "$VERSION" --repo ${{ env.PUBLIC_REPO }} --yes 2>/dev/null || true
          
          # 收集所有安装包文件
          FILES=""
          for f in ./artifacts/msi/*.msi ./artifacts/nsis/*.exe; do
            if [ -f "$f" ]; then
              FILES="$FILES $f"
            fi
          done
          
          if [ -z "$FILES" ]; then
            echo "Error: No installer files found!"
            exit 1
          fi
          
          echo "Uploading files: $FILES"
          
          # 创建新 release
          gh release create "$VERSION" \
            --repo ${{ env.PUBLIC_REPO }} \
            --title "Kiro Token Manager $VERSION" \
            --notes "## 下载说明

| 文件 | 说明 |
|------|------|
| \`.msi\` | Windows 安装包，推荐使用 |
| \`.exe\` | NSIS 安装程序 |

## 安装

1. 下载 \`.msi\` 文件
2. 双击运行安装
3. 按提示完成安装

## 系统要求

- Windows 10/11 (64-bit)
- WebView2 Runtime (Windows 11 已内置，Windows 10 会自动安装)

---
*此版本由 GitHub Actions 自动构建*" \
            $FILES
